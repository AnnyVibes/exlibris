<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Estante de libros en forma de arco con flores">
  <defs>
    <linearGradient id="madera" x1="0" x2="1">
      <stop offset="0" stop-color="#c79a7a"/><stop offset="1" stop-color="#a87657"/>
    </linearGradient>
    <linearGradient id="ala" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/><stop offset="1" stop-color="#ffd6e1" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="fondoArco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7f9"/><stop offset="1" stop-color="#ffe3ea"/>
    </linearGradient>
    <g id="flor">
      <circle cx="0" cy="-9" r="9" fill="#ffb3c6"/><circle cx="9" cy="-2" r="9" fill="#ffc2d1"/>
      <circle cx="5" cy="8" r="9" fill="#ffb3c6"/><circle cx="-6" cy="8" r="9" fill="#ffc9d6"/>
      <circle cx="-9" cy="-2" r="9" fill="#ffbccc"/><circle cx="0" cy="0" r="5" fill="#d9577f"/>
      <circle cx="0" cy="0" r="2.2" fill="#7a2747"/>
    </g>
    <g id="florChica">
      <circle cx="0" cy="-5" r="5" fill="#ffd0dc"/><circle cx="5" cy="0" r="5" fill="#ffc4d3"/>
      <circle cx="0" cy="5" r="5" fill="#ffd0dc"/><circle cx="-5" cy="0" r="5" fill="#ffc4d3"/>
      <circle r="2.4" fill="#e0698e"/>
    </g>
    <g id="hoja"><path d="M0 0c6-10 18-12 22-10-4 8-12 14-22 10z" fill="#bcd98a"/></g>
  </defs>

  <!-- Alas -->
  <path d="M120 120C70 70 40 40 10 30c10 40 30 70 60 90-25 0-45 10-55 25 35 5 70-5 105-20z" fill="url(#ala)" stroke="#fff" stroke-width="2"/>
  <path d="M280 120c50-50 80-80 110-90-10 40-30 70-60 90 25 0 45 10 55 25-35 5-70-5-105-20z" fill="url(#ala)" stroke="#fff" stroke-width="2"/>
  <path d="M25 40c30 25 55 50 85 78M375 40c-30 25-55 50-85 78" stroke="#fff" stroke-width="1.5" fill="none" opacity=".8"/>

  <!-- Suelo -->
  <ellipse cx="200" cy="304" rx="150" ry="12" fill="#d9eab4"/>

  <!-- Arco del estante -->
  <path d="M110 300V140a90 90 0 0 1 180 0v160z" fill="url(#madera)"/>
  <path d="M126 296V142a74 74 0 0 1 148 0v154z" fill="url(#fondoArco)"/>

  <!-- Ventanita -->
  <path d="M186 96a14 14 0 0 1 28 0v16h-28z" fill="#cfe7f2" stroke="#a87657" stroke-width="4"/>

  <!-- Repisas -->
  <rect x="126" y="170" width="148" height="7" fill="#a87657"/>
  <rect x="126" y="232" width="148" height="7" fill="#a87657"/>

  <!-- Libros fila 1 -->
  <rect x="140" y="128" width="13" height="42" rx="2" fill="#f9a9bf"/>
  <rect x="155" y="120" width="15" height="50" rx="2" fill="#cfe3a1"/>
  <rect x="172" y="132" width="11" height="38" rx="2" fill="#ffdbe5"/>
  <rect x="185" y="124" width="16" height="46" rx="2" fill="#e0698e"/>
  <rect x="203" y="130" width="12" height="40" rx="2" fill="#fff"/>
  <rect x="218" y="136" width="12" height="34" rx="2" fill="#f38eab" transform="rotate(-14 224 170)"/>
  <rect x="238" y="128" width="14" height="42" rx="2" fill="#e4f0c8"/>
  <!-- Libros fila 2 -->
  <rect x="136" y="190" width="16" height="42" rx="2" fill="#cfe3a1"/>
  <rect x="154" y="184" width="12" height="48" rx="2" fill="#ffc4d3"/>
  <rect x="168" y="192" width="14" height="40" rx="2" fill="#fff"/>
  <rect x="184" y="186" width="13" height="46" rx="2" fill="#f9a9bf"/>
  <rect x="210" y="214" width="48" height="9" rx="2" fill="#e0698e"/>
  <rect x="214" y="205" width="40" height="9" rx="2" fill="#ffdbe5"/>
  <rect x="212" y="223" width="44" height="9" rx="2" fill="#cfe3a1"/>
  <!-- Fila 3: planta y libros -->
  <path d="M150 296h22l-3-20h-16z" fill="#e0a37f"/>
  <path d="M161 276c-6-12-14-14-18-12 4 8 10 12 18 12zM161 276c4-14 12-18 18-16-4 9-10 14-18 16zM161 276v-18" stroke="#8fb85a" stroke-width="3" fill="#bcd98a"/>
  <rect x="190" y="252" width="15" height="44" rx="2" fill="#ffc4d3"/>
  <rect x="207" y="258" width="12" height="38" rx="2" fill="#f38eab"/>
  <rect x="221" y="248" width="16" height="48" rx="2" fill="#e4f0c8"/>
  <rect x="239" y="256" width="13" height="40" rx="2" fill="#fff"/>

  <!-- Flores y hojas alrededor del arco -->
  <use href="#hoja" x="150" y="70" transform="rotate(-30 150 70)"/>
  <use href="#hoja" x="230" y="60"/>
  <use href="#hoja" x="100" y="160" transform="rotate(-80 100 160)"/>
  <use href="#hoja" x="292" y="150" transform="rotate(40 292 150)"/>
  <use href="#flor" x="160" y="66"/>
  <use href="#flor" x="200" y="52"/>
  <use href="#flor" x="240" y="66"/>
  <use href="#florChica" x="180" y="56"/>
  <use href="#florChica" x="222" y="54"/>
  <use href="#flor" x="124" y="104"/>
  <use href="#flor" x="278" y="104"/>
  <use href="#florChica" x="112" y="140"/>
  <use href="#florChica" x="290" y="138"/>
  <use href="#flor" x="104" y="282"/>
  <use href="#flor" x="296" y="282"/>
  <use href="#florChica" x="84" y="296"/>
  <use href="#florChica" x="318" y="296"/>
  <use href="#hoja" x="70" y="296" transform="rotate(-160 70 296)"/>
  <use href="#hoja" x="320" y="290"/>
</svg>
