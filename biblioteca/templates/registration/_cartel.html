{# Cartel geométrico de la pantalla de acceso: cada bloque es un libro (lomos, pilas y tapas). #}
<section class="cartel" aria-label="Ex Libris, biblioteca personal">
  <div class="bloque b-marca">
    <h1 class="cartel-marca">Ex Libris</h1>
    <p class="cartel-sub">Biblioteca personal</p>
  </div>
  <div class="bloque b-lomo b-lila"><span>Escanea</span></div>
  <div class="bloque b-lomo b-rosa"><span>Anota</span></div>
  <div class="bloque b-lomo b-amarillo"><span>Comparte</span></div>
  <div class="bloque b-codigo" aria-hidden="true">
    <span class="codigo-barras"></span>
    <small>978-EX-LIBRIS</small>
  </div>
  <div class="bloque b-borde b-derecha" aria-hidden="true"></div>
  <div class="bloque b-pie">
    <p>Tu biblioteca, siempre contigo.</p>
  </div>
</section>
