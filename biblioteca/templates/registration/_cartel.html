{# Cartel geométrico de la pantalla de acceso: cada bloque es un libro (lomos y pila). Paleta: amarillo, lavanda y rosado pastel. #}
<section class="cartel" aria-label="Ex Libris, biblioteca personal">
  <div class="bloque b-marca">
    <h1 class="cartel-marca">Ex Libris</h1>
    <p class="cartel-sub">Biblioteca personal</p>
  </div>
  <div class="bloque b-lomo b-amarillo"><span>Escanea</span></div>
  <div class="bloque b-lomo b-rosa"><span>Anota</span></div>
  <div class="bloque b-lomo b-lila"><span>Comparte</span></div>
  <div class="bloque b-pila p1" aria-hidden="true"></div>
  <div class="bloque b-pila p2" aria-hidden="true"></div>
  <div class="bloque b-pila p3" aria-hidden="true"></div>
  <div class="bloque b-pie"><p>Tu biblioteca, siempre contigo.</p></div>
</section>
