{% load exlibris %}{% with d=p.dias_para_devolver %}{% if d is None %}<span class="plazo plazo-libre">Sin fecha</span>{% elif d < 0 %}<span class="plazo plazo-vencido">Vencido hace {{ d|absoluto|dias_texto|lower }}</span>{% elif d == 0 %}<span class="plazo plazo-hoy">Vence hoy</span>{% else %}<span class="plazo plazo-ok">Faltan {{ d|dias_texto|lower }}</span>{% endif %}{% if p.devolver_el %}<small class="plazo-fecha">{{ p.devolver_el|date:"j M Y" }}</small>{% endif %}{% endwith %}
